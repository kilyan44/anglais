var V=[
["artificial intelligence (AI)","intelligence artificielle","a machine that does tasks that need human intelligence","AI can play chess and recognize faces.","v"],
["strong AI","IA forte","a machine that really thinks like a human (it does not exist yet)","Strong AI is still science fiction.","v"],
["weak AI (narrow AI)","IA faible (étroite)","AI that does one task well","Deep Blue is a weak AI.","v"],
["expert system","système expert","a program with human knowledge and rules inside","An expert system follows rules written by people.","v"],
["handcrafted rules","règles écrites à la main","rules made by people, not learned by the machine","Old AI used handcrafted rules.","v"],
["machine learning","apprentissage automatique","the computer learns from examples","Machine learning needs a lot of data.","v"],
["neural network","réseau de neurones","a system inspired by the brain, with many small units","A neural network can learn to see dogs.","v"],
["node","nœud","one small unit in a neural network","Each node is like an artificial neuron.","v"],
["algorithm","algorithme","a list of steps that a computer follows","The algorithm checks millions of moves.","v"],
["data","données","information: numbers, texts, pictures","More data means better learning.","v"],
["pattern recognition","reconnaissance de motifs","finding the same shapes or habits in data","Pattern recognition helps read handwriting.","v"],
["computer vision","vision par ordinateur","a computer that can see pictures","Computer vision helps self-driving cars.","v"],
["natural language processing (NLP)","traitement du langage naturel","a computer that understands human language","NLP is used in translation apps.","v"],
["robotics","robotique","building machines that move in the real world","Robotics mixes AI and engineering.","v"],
["knowledge management","gestion des connaissances","organizing information so people can use it","Expert systems use knowledge management.","v"],
["reasoning","raisonnement","thinking step by step to find a conclusion","Reasoning is a part of intelligence.","v"],
["problem solving","résolution de problèmes","finding an answer to a difficult question","Chess is a problem-solving task.","v"],
["perception","perception","understanding the world with senses or sensors","Perception helps a car see the road.","v"],
["generalization","généralisation","using what you learned in a new situation","Generalization means working on new cases.","v"],
["to improve itself","s’améliorer tout seul","to get better without help","A learning program improves itself.","v"],
["confidence","niveau de certitude","how sure the system is about its answer","Watson gives an answer with a confidence level.","v"],
["general-purpose method","méthode générale","a method that works for many problems","AlphaGo uses general-purpose methods.","v"],
["creativity","créativité","making new and original things","Creativity was just starting in 2016.","v"],
["the Turing test","le test de Turing","a test: can a judge tell a machine from a human by talking?","Turing proposed the test in 1950.","v"],
["to mimic","imiter, simuler","to copy how something works","The AI tries to mimic the human brain.","v"],
["AI effect","l’effet IA","after a machine succeeds, people say it is not real AI","The AI effect makes AI hard to define.","v"],
["brute force","force brute","trying a huge number of possibilities","Deep Blue used brute force.","v"],
["reinforcement learning","apprentissage par renforcement","learning by trying and getting rewards","AlphaGo learned by playing against itself.","v"],
["First, … Then, … Finally, …","D’abord… Ensuite… Enfin…","to organize your answer","First, the idea. Then, an example.","o"],
["The main idea is…","L’idée principale est…","to start a summary","The main idea is that AI has many forms.","o"],
["For example, …","Par exemple, …","to give an example","For example, Deep Blue plays chess.","o"],
["It means that…","Cela veut dire que…","to explain","It means that the machine learns alone.","o"],
["In other words, …","En d’autres termes, …","to say it again in a simpler way","In other words, it learns from examples.","o"],
["On the one hand… on the other hand…","D’un côté… de l’autre…","to compare two things","On the one hand it is fast. On the other hand it is narrow.","o"],
["However, …","Cependant, …","to show a contrast","However, it cannot think like a human.","o"],
["because / so","parce que / donc","to give a reason / a result","It is weak AI because it does one task.","o"],
["As far as I know, …","À ma connaissance, …","when you are not 100% sure","As far as I know, the video is from 2016.","o"],
["I think that…","Je pense que…","to give your opinion","I think that AI will keep growing.","o"],
["Could you repeat the question, please?","Pouvez-vous répéter la question ?","when you did not understand","Sorry, could you repeat the question, please?","o"],
["Let me think for a second.","Laissez-moi réfléchir une seconde.","to get a little time","Hmm, let me think for a second.","o"],
["What I mean is…","Ce que je veux dire, c’est…","to explain yourself better","What I mean is that it is not a human brain.","o"],
["Similarly, … / In contrast, …","De même… / Au contraire…","to link two videos","In contrast, the other video talks about the future.","o"],
["This video talks about…","Cette vidéo parle de…","to introduce the video","This video talks about what AI really is.","o"],
["The speaker says that…","Le narrateur dit que…","to report the ideas","The speaker says that there are many types of AI.","o"],
["According to the video, …","Selon la vidéo, …","to give the source","According to the video, the term AI started in 1955.","o"],
["To sum up, …","Pour résumer, …","to finish your answer","To sum up, there are many kinds of AI.","o"]
];
var C=[
["Le début : Dartmouth (1955-1956)","AI is a machine that does tasks that humans usually do with their brain. The term comes from John McCarthy.",["Le terme « IA » vient de John McCarthy (proposition de Dartmouth en 1955, atelier en 1956).","Avant, le domaine n’avait pas de nom (Alan Turing avait déjà travaillé dessus).","IA : une machine qui fait des tâches humaines et apprend à s’améliorer."]],
["Les 7 axes de départ","The video lists early AI goals such as brain, language, neurons, complexity, self-improvement, abstraction, chance and creativity.",["La vidéo énumère des axes comme le cerveau, le langage, les neurones, la complexité, l’auto-amélioration, l’abstraction, le hasard et la créativité. Attention : la liste orale/transcrite ne correspond pas clairement à sept éléments si chaque terme est compté séparément.","En 2016, selon le narrateur : le langage et la complexité progressent ; l’auto-amélioration reste limitée ; la créativité est à ses débuts, par exemple des histoires générées mais peu cohérentes.","Il s’agit d’un état des lieux subjectif de 2016, pas d’une mesure scientifique définitive. Distingue les objectifs historiques de ce que les systèmes actuels savent faire."]],
["Les domaines de l’IA","The video mentions machine learning, computer vision, natural language processing, robotics, pattern recognition and knowledge representation.",["Machine learning : apprendre des régularités à partir de données. Vision par ordinateur : analyser images et vidéos. Traitement automatique du langage : traiter ou produire du texte et de la parole.","Robotique : percevoir et agir dans le monde physique. Reconnaissance de motifs : repérer des régularités. Gestion/représentation des connaissances : organiser des faits et des règles utilisables par un système.","Ces domaines se chevauchent : un robot peut utiliser la vision, le langage et l’apprentissage automatique. La gestion des connaissances est différente de l’apprentissage à partir de données."]],
["Qu’est-ce que l’intelligence ?","Intelligence has five parts: learning, reasoning, problem solving, perception and language.",["Selon Jack Copeland : généralisation, raisonnement, résolution de problèmes, perception, langage.","L’intelligence a plusieurs facettes. Une IA est forte sur une seule."]],
["Strong AI, weak AI et entre-deux","Strong AI copies the brain. Weak AI acts like a human. Watson is in the middle.",["IA forte : copier le cerveau et vraiment penser. On en est très loin.","IA faible : agit comme un humain sans expliquer le cerveau (Deep Blue : échecs, millions de coups).","Entre-deux : IBM Watson. Il lit, trouve des motifs et répond avec un pourcentage de certitude."]],
["Machine learning et réseaux de neurones","Machine learning means the computer learns from examples. Neural networks are a part of it.",["Le programme s’améliore avec plus de données : on programme avec des exemples (photos de chiens).","Trois cercles : IA, puis machine learning, puis réseaux de neurones.","DeepMind (Google) : des nœuds comme des neurones artificiels, inspirés du cerveau."]],
["Systèmes experts contre AlphaGo","Expert systems use human rules. AlphaGo learns by itself.",["Système expert : connaissances humaines et règles dans l’ordinateur.","AlphaGo : pas de règles écrites à la main, des méthodes générales de machine learning.","Espoir de Demis Hassabis : le climat et les maladies complexes."]],
["Conclusion et limites","There are many AIs, and each one is good at one thing. The video is from 2016.",["Il existe beaucoup d’IA, chacune est bonne dans un seul domaine.","La vidéo date de 2016 : pas de deep learning moderne ni d’IA générative.","Piège : « Jay McCartney » dans la transcription, c’est John McCarthy."]]
];
var R=[
["Histoire et définition","La proposition de Dartmouth a été rédigée en 1955 par John McCarthy et ses collègues ; l’atelier a eu lieu en 1956. Certaines transcriptions affichent « Jay McCartney » : c’est une erreur.","L’intelligence artificielle étudie comment les machines peuvent accomplir des tâches associées à l’intelligence humaine.","Ne confonds pas la proposition de 1955 et l’atelier de 1956.","<a href='https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth' target='_blank' rel='noopener'>Dartmouth</a> · <a href='https://www.ibm.com/fr-fr/think/topics/history-of-artificial-intelligence' target='_blank' rel='noopener'>IBM</a>"],
["Les formes d’intelligence","La vidéo cite l’apprentissage, le raisonnement, la résolution de problèmes, la perception et le langage. La généralisation consiste à utiliser ce qu’on a appris dans une situation nouvelle.","La généralisation consiste à réutiliser ce qu’un système a appris dans une nouvelle situation. Le raisonnement consiste à tirer des conclusions.","Prépare une définition simple et un exemple pour chaque notion.","<a href='https://pickscribe.com/v/kWmX3pd1f10/' target='_blank' rel='noopener'>Transcription de la vidéo</a>"],
["Strong AI et weak AI","Dans la vidéo, la strong AI vise une intelligence générale comparable à celle d’un humain ; la weak AI est spécialisée dans des tâches. Deep Blue, qui joue aux échecs, illustre la seconde. « Weak » ne veut pas dire mauvais.","L’IA forte vise une intelligence générale comparable à celle d’un humain. L’IA faible, ou spécialisée, est conçue pour des tâches précises, comme jouer aux échecs.","Explique pourquoi une IA très performante aux échecs ne possède pas nécessairement une intelligence générale.","<a href='https://ai100.stanford.edu/about/history' target='_blank' rel='noopener'>Stanford AI100</a>"],
["Machine learning et réseaux de neurones","Le machine learning permet à un modèle d’apprendre des régularités à partir de données. Les réseaux de neurones sont une famille de modèles de machine learning. Ils sont inspirés du cerveau, mais ne le reproduisent pas exactement.","L’apprentissage automatique utilise des données pour améliorer un modèle. Les réseaux de neurones constituent un type de modèle d’apprentissage automatique.","Hiérarchie à retenir : AI → machine learning → neural networks.","<a href='https://www.ibm.com/fr-fr/think/topics/history-of-artificial-intelligence' target='_blank' rel='noopener'>IBM</a>"],
["Watson et le score de confiance","La vidéo présente Watson comme un système qui lit beaucoup d’informations, repère des motifs et donne une réponse avec un niveau de confiance. Un score de confiance n’est pas une garantie que la réponse est vraie.","Un score de confiance indique à quel point un système estime sa réponse fiable ; il ne prouve pas que cette réponse est correcte.","Watson est présenté comme un entre-deux : inspiré de certains aspects du raisonnement humain sans copier exactement le cerveau.","<a href='https://pickscribe.com/v/kWmX3pd1f10/' target='_blank' rel='noopener'>Transcription</a>"],
["Systèmes experts","Un système expert utilise des connaissances humaines et des règles codées pour résoudre des problèmes d’un domaine précis. Il faut écrire et maintenir les règles, et il peut être difficile de prévoir tous les cas.","Un système expert utilise une base de connaissances et des règles écrites par des humains pour résoudre des problèmes dans un domaine précis.","Mots-clés : knowledge base, human expertise, handcrafted rules, limited domain.","<a href='https://ai100.stanford.edu/about/history' target='_blank' rel='noopener'>Stanford AI100</a>"],
["AlphaGo","AlphaGo a appris à jouer au Go avec des méthodes de machine learning plutôt qu’en utilisant uniquement des règles écrites à la main. L’idée importante dans la vidéo est que des méthodes générales pourraient être adaptées à d’autres problèmes complexes.","AlphaGo a appris des stratégies pour jouer au jeu de go grâce à des méthodes d’apprentissage automatique.","Différence : un système expert repose sur des règles humaines ; AlphaGo apprend des stratégies à partir de l’entraînement.","<a href='https://pickscribe.com/v/kWmX3pd1f10/' target='_blank' rel='noopener'>Transcription</a>"],
["Dates et exemples historiques","Deep Blue a battu Garry Kasparov en match en 1997. IBM Watson a gagné à Jeopardy! en 2011. AlphaGo a battu Lee Sedol en 2016. MYCIN est un système expert historique d’aide au diagnostic d’infections bactériennes.","Deep Blue illustre une IA spécialisée dans les échecs ; Watson répond à des questions en langage naturel à partir de grandes quantités d’informations ; AlphaGo a appris des stratégies de Go ; MYCIN utilisait une base de connaissances et des règles pour proposer des recommandations médicales.","Compare les approches : règles explicites (MYCIN), recherche de coups (Deep Blue), traitement de questions (Watson), apprentissage de stratégies (AlphaGo). Ce sont des systèmes différents, pas des étapes qui remplacent automatiquement les précédentes.","<a href='https://www.ibm.com/history/deep-blue' target='_blank' rel='noopener'>IBM: Deep Blue</a> · <a href='https://www.ibm.com/history/watson-jeopardy' target='_blank' rel='noopener'>IBM: Watson and Jeopardy!</a> · <a href='https://deepmind.google/discover/blog/alphago-the-story-so-far/' target='_blank' rel='noopener'>Google DeepMind: AlphaGo</a> · <a href='https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2556426/' target='_blank' rel='noopener'>MYCIN overview</a>"],
["Regard critique et définitions","La vidéo oppose strong AI, qui chercherait à reproduire une intelligence humaine générale ou le fonctionnement du cerveau, à weak AI, conçue pour des tâches précises. Elle présente AlphaGo comme une approche différente des systèmes experts.","Dans l’usage courant, “strong AI” peut désigner une IA générale comparable à l’humain, parfois associée à la compréhension ou à la conscience ; les définitions varient. “Weak/narrow AI” désigne généralement une IA spécialisée. Dire qu’AlphaGo est “le premier système non expert” serait trop large : des systèmes d’apprentissage automatique existaient bien avant lui ; AlphaGo est surtout un jalon majeur pour le Go.","Formule prudente : “The video presents AlphaGo as a contrast to rule-based expert systems.” Évite d’affirmer qu’AlphaGo était le premier système non expert. La vidéo de 2016 donne un point de vue historique daté, pas une définition universelle.","<a href='https://plato.stanford.edu/entries/artificial-intelligence/' target='_blank' rel='noopener'>Stanford Encyclopedia of Philosophy: Artificial Intelligence</a> · <a href='https://www.ibm.com/fr-fr/think/topics/history-of-artificial-intelligence' target='_blank' rel='noopener'>IBM: histoire de l’IA</a>"],
["Les sept objectifs historiques","La proposition évoquée dans la vidéo cite notamment le langage, les neurones, la complexité, l’auto-amélioration, l’abstraction, le hasard et la créativité. L’évaluation de ce qui était accompli reflète l’opinion du narrateur en 2016.","La vidéo évoque des objectifs historiques de l’IA, comme le langage, l’abstraction, l’amélioration autonome et la créativité.","Pour les affirmations datées, dis « according to the video » : c’est l’état des lieux du narrateur en 2016.","<a href='https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth' target='_blank' rel='noopener'>Dartmouth</a> · <a href='https://pickscribe.com/v/kWmX3pd1f10/' target='_blank' rel='noopener'>Transcription</a>"],
["Applications de l’IA","Computer vision analyse des images ; natural language processing traite le langage humain ; pattern recognition repère des régularités ; robotics concerne les robots. Ces domaines peuvent se recouper.","La vision par ordinateur analyse des images. Le traitement automatique du langage s’intéresse au langage humain. La reconnaissance de formes repère des régularités dans les données.","Prépare un exemple simple pour chaque terme.","<a href='https://pickscribe.com/v/kWmX3pd1f10/' target='_blank' rel='noopener'>Transcription de la vidéo</a>"],
["Test de Turing et effet IA","Le test de Turing est un jeu de l’imitation : un évaluateur échange à distance des messages avec un humain et une machine et doit identifier lequel est la machine. La vidéo utilise cette idée pour parler de l’intelligence.","Le test évalue un comportement conversationnel observable, pas la conscience ni la compréhension intérieure. Les critiques soulignent qu’un système peut tromper un évaluateur sans comprendre comme un humain, et que le résultat dépend du juge, du contexte et des règles du test. L’effet IA est l’idée qu’une fois une technologie devenue courante, on cesse parfois de la considérer comme de l’IA.","Pour l’oral, précise que réussir le test ne prouve pas à lui seul une intelligence générale ou une conscience. Le test original de Turing date de 1950 ; les interprétations modernes varient.","<a href='https://plato.stanford.edu/entries/turing-test/' target='_blank' rel='noopener'>Stanford Encyclopedia of Philosophy: Turing Test</a> · <a href='https://ai100.stanford.edu/about/history' target='_blank' rel='noopener'>Stanford AI100</a>"],
["Alan Turing et le jeu de l’imitation","La vidéo cite Alan Turing parmi les chercheurs qui travaillaient sur ces questions avant que le terme IA soit proposé.","En 1950, Turing publie “Computing Machinery and Intelligence” et propose le jeu de l’imitation. Un juge échange des messages écrits avec un humain et une machine, puis essaie de les distinguer. Cela transforme la question abstraite « une machine peut-elle penser ? » en une épreuve de comportement observable.","Le test porte sur une conversation observable : il ne démontre pas à lui seul que la machine est consciente ou comprend comme un humain.","<a href='https://plato.stanford.edu/entries/turing-test/' target='_blank' rel='noopener'>Stanford Encyclopedia of Philosophy: Turing Test</a>"],
["Les trois grandes familles du machine learning","La vidéo décrit surtout l’apprentissage à partir d’exemples, avec des images de chiens, et explique que le système s’améliore avec les données.","Apprentissage supervisé : exemples étiquetés, comme des photos marquées « chien ». Apprentissage non supervisé : le système cherche des structures sans étiquettes fournies. Apprentissage par renforcement : il apprend par essais et récompenses ; cette approche est utilisée dans AlphaGo.","Le modèle est entraîné sur des données puis testé sur de nouveaux exemples. Réussir sur des données jamais vues permet d’évaluer sa généralisation.","<a href='https://www.ibm.com/fr-fr/think/topics/machine-learning' target='_blank' rel='noopener'>IBM : machine learning</a>"],
["Créativité et IA générative","La vidéo montre des scripts et des films écrits en tout ou partie par une IA, mais estime que les résultats de 2016 n’ont pas encore beaucoup de sens.","Sunspring (2016) est un court métrage dont le scénario a été généré par un réseau de neurones. Depuis, les IA génératives ont beaucoup progressé dans la production de textes et d’images cohérents ; cette évolution dépasse le constat fait dans la vidéo.","La vidéo date de 2016 : quand tu compares avec aujourd’hui, indique clairement que tu ajoutes un recul postérieur à la vidéo.","<a href='https://www.ibm.com/fr-fr/think/topics/generative-ai' target='_blank' rel='noopener'>IBM : IA générative</a>"],
["Nuancer l’affirmation sur AlphaGo","La vidéo présente AlphaGo comme peut-être le premier système non expert de son année, en opposition aux systèmes experts basés sur des règles.","Cette formulation est trop générale si on la prend au pied de la lettre : les techniques d’apprentissage automatique existaient avant AlphaGo, notamment dans la reconnaissance vocale et d’images. AlphaGo est plutôt un jalon majeur car il a atteint un niveau remarquable au jeu de Go.","Phrase prudente en anglais : “The video presents AlphaGo as a contrast to rule-based expert systems.” Évite d’affirmer qu’il s’agissait du premier système non expert de toute l’histoire.","<a href='https://plato.stanford.edu/entries/artificial-intelligence/' target='_blank' rel='noopener'>Stanford Encyclopedia of Philosophy: Artificial Intelligence</a> · <a href='https://deepmind.google/discover/blog/alphago-the-story-so-far/' target='_blank' rel='noopener'>Google DeepMind: AlphaGo</a>"]
];
var Q=[
["What is AI according to the video?","Une machine ou un programme qui apprend à faire des tâches qui demandent l’intelligence humaine.","AI is a machine or a program that learns to do tasks that usually need human intelligence."],
["Who created the term AI, and when?","John McCarthy, pour Dartmouth : idée écrite en 1955, rencontre à l’été 1956.","John McCarthy, for a meeting at Dartmouth College. The idea was written in 1955 and the meeting was in 1956."],
["What are the main parts of intelligence?","Cinq : apprendre, raisonner, résoudre des problèmes, percevoir, comprendre le langage (Copeland).","There are five: learning, reasoning, problem solving, perception and understanding language."],
["What is the difference between strong AI and weak AI?","L’IA forte veut copier le cerveau et penser. L’IA faible agit comme un humain sans expliquer le cerveau.","Strong AI wants to copy the brain and really think. Weak AI acts like a human but does not explain the brain. Deep Blue is an example."],
["Why is Deep Blue a weak AI?","Il ne fait qu’une chose : jouer aux échecs, en vérifiant des millions de coups.","It only plays chess. It checks millions of moves, but it does not think like a human."],
["Why is Watson “in the middle”?","Inspiré de la pensée humaine sans la copier. Il lit, trouve des motifs, répond avec un niveau de certitude.","It is inspired by human thinking, but it does not copy it. It reads a lot, finds patterns and gives an answer with a confidence level."],
["What is machine learning? Give an example.","L’ordinateur apprend à partir de données. Exemple : beaucoup de photos de chiens, puis il reconnaît un nouveau chien.","The computer learns from data and gets better with more examples. For example, it sees many dogs and then recognizes a new one."],
["How are AI, machine learning and neural networks connected?","Trois cercles : l’IA est le grand, le machine learning est dedans, les réseaux de neurones sont dedans.","Think of three circles. AI is the big one, machine learning is inside it, and neural networks are inside machine learning."],
["What is an expert system? What are its problems?","Programme avec connaissances et règles humaines. Il faut écrire toutes les règles et il n’apprend pas seul.","It is a program with human knowledge and rules. But people must write all the rules, and it cannot learn alone."],
["Why is AlphaGo different from an expert system?","Pas de règles écrites à la main : des méthodes générales de machine learning, il apprend le Go seul.","It does not use handcrafted rules. It uses general machine learning methods and learns Go by itself."],
["Which of the seven ideas were done by 2016?","Langage, complexité, auto-amélioration (en partie). La créativité débutait.","Language, complexity and self-improvement were partly done. Creativity was just starting."],
["What is the conclusion of the video?","Il y a beaucoup d’IA, chacune est bonne dans un seul domaine.","There are many AIs, and each one is good at one thing."],
["Why is it hard to define AI?","L’intelligence a beaucoup de parties, et après un succès on dit « ce n’est pas la vraie IA » : l’effet IA.","Intelligence has many parts. Also, after a machine succeeds, people say it is not real AI. This is the AI effect."],
["Is the video still up to date?","Idées principales vraies, mais vidéo de 2016. Aujourd’hui l’IA écrit et crée des images, mais pas d’IA forte.","The main ideas are true, but the video is from 2016. Today AI writes texts and makes images, but we still have no strong AI."],
["What is the Turing test?","Un juge discute par écrit avec un humain et une machine. S’il ne distingue pas la machine, elle réussit.","A judge talks in writing with a human and a machine. If the judge cannot tell which one is the machine, it passes the test."],
["What are the main fields of AI?","Apprentissage automatique, vision par ordinateur, traitement du langage naturel, robotique, reconnaissance de motifs et gestion des connaissances.","They include machine learning, computer vision, natural language processing, robotics, pattern recognition and knowledge representation."],
["What are the seven early AI goals, and how successful were they?","La vidéo cite plusieurs axes, dont le langage, la complexité, l’auto-amélioration, l’abstraction, le hasard et la créativité. En 2016, certains progressaient, tandis que la créativité restait limitée.","The video lists early goals such as language, complexity, self-improvement, abstraction, chance and creativity. In 2016, some had made progress, while creativity was still limited."],
["What happened in 1997, 2011 and 2016?","Deep Blue a battu Kasparov aux échecs en 1997 ; Watson a gagné à Jeopardy! en 2011 ; AlphaGo a battu Lee Sedol au Go en 2016.","Deep Blue beat Kasparov at chess in 1997; Watson won Jeopardy! in 2011; AlphaGo beat Lee Sedol at Go in 2016."],
["What is MYCIN, and how is it different from AlphaGo?","MYCIN est un système expert basé sur des connaissances et des règles explicites ; AlphaGo a appris des stratégies grâce à l’entraînement.","MYCIN was an expert system based on knowledge and explicit rules; AlphaGo learned strategies through training."],
["What are the criticisms of the Turing test?","Il évalue une conversation observable, pas directement la conscience ou la compréhension. Un système peut tromper un juge sans penser comme un humain.","It evaluates observable conversation, not consciousness or understanding directly. A system might fool a judge without thinking like a human."],
["Why should we be careful with the claim that AlphaGo was the first non-expert system?","Cette formule est trop générale : l’apprentissage automatique existait avant AlphaGo. C’est surtout une avancée majeure dans le jeu de Go.","That claim is too broad: machine learning existed before AlphaGo. It was a major breakthrough specifically in Go."]

["The Dartmouth proposal was written in 1955 by John McCarthy and colleagues; the workshop took place in 1956. Some transcripts say “Jay McCartney” by mistake.","Artificial intelligence studies how machines can perform tasks associated with human intelligence.","Do not confuse the 1955 proposal with the 1956 workshop."],
["The video mentions learning, reasoning, problem-solving, perception and language. Generalization means using what you learned in a new situation.","Generalization means using what a system has learned in a new situation. Reasoning means drawing conclusions.","Prepare a simple definition and one example for each concept."],
["In the video, strong AI aims for human-like general intelligence; weak AI specializes in tasks. Deep Blue, which plays chess, is an example of the latter. “Weak” does not mean bad.","Strong AI aims at human-like general intelligence. Weak or narrow AI is designed for specific tasks, such as playing chess.","Explain why an AI that is excellent at chess does not necessarily have general intelligence."],
["Machine learning lets a model learn patterns from data. Neural networks are a family of machine-learning models inspired by the brain, but they do not reproduce it exactly.","Machine learning uses data to improve a model. Neural networks are one type of machine-learning model.","Remember the hierarchy: AI → machine learning → neural networks."],
["The video presents Watson as a system that reads lots of information, finds patterns and answers with a confidence level. A confidence score does not guarantee that an answer is true.","A confidence score describes how confident a system is in an answer; it does not prove that the answer is correct.","Watson is presented as somewhere in between: inspired by aspects of human reasoning without exactly copying the brain."],
["An expert system uses human knowledge and coded rules to solve problems in a specific field. The rules must be written and maintained, and not every case is easy to anticipate.","An expert system uses a knowledge base and human-written rules to solve problems in a specific domain.","Keywords: knowledge base, human expertise, handcrafted rules, limited domain."],
["AlphaGo learned to play Go using machine-learning methods rather than only hand-written rules. The video suggests general methods could be adapted to other complex problems.","AlphaGo learned strategies for the game of Go using machine-learning methods.","Difference: an expert system relies on human-written rules; AlphaGo learns strategies through training."],
["The proposal mentioned language, neurons, complexity, self-improvement, abstraction, chance and creativity. The assessment of progress reflects the narrator’s view in 2016.","The video discusses early AI goals such as language, abstraction, self-improvement and creativity.","For dated claims, say “according to the video”: this is the narrator’s assessment in 2016."],
["Computer vision analyzes images; natural language processing works with human language; pattern recognition finds regularities; robotics concerns robots. These areas can overlap.","Computer vision works with images. Natural language processing works with human language. Pattern recognition finds regularities in data.","Prepare a simple example for each term."],
["The Turing test asks a judge to exchange messages with a human and a machine and try to tell them apart. The “AI effect” is the idea that once a technology becomes common, people may stop calling it AI. This is extra context.","The Turing test asks whether a judge can distinguish a machine from a human through conversation.","Distinguish ideas in the video from extra background research."],
["Deep Blue beat Garry Kasparov in a match in 1997. IBM Watson won the TV quiz Jeopardy! in 2011. AlphaGo defeated Lee Sedol in 2016. MYCIN was an expert system designed to support diagnosis of bacterial infections.","Deep Blue specialized in chess; Watson answered natural-language questions using large collections of information; AlphaGo learned Go strategies; MYCIN used a knowledge base and rules for medical recommendations.","Compare explicit rules (MYCIN), move search (Deep Blue), question answering (Watson) and learned strategies (AlphaGo). These are different approaches, not stages that automatically replace each other."],
["The video contrasts strong AI, which aims at human-like general intelligence or brain-like thinking, with weak AI designed for specific tasks. It presents AlphaGo as different from expert systems.","In common usage, strong AI can mean general intelligence comparable to human intelligence and is sometimes associated with understanding or consciousness; definitions vary. Weak or narrow AI usually means specialized AI. Calling AlphaGo the first non-expert system is too broad: machine-learning systems existed long before it.","A careful phrasing is: “The video presents AlphaGo as a contrast to rule-based expert systems.” Avoid claiming it was the first non-expert system; it was a major milestone for Go."],
["The video mentions Alan Turing among researchers who worked on these questions before the term AI was proposed.","In 1950, Turing published “Computing Machinery and Intelligence” and proposed the imitation game. A judge exchanges written messages with a human and a machine, then tries to tell them apart. This turns the abstract question “Can machines think?” into a test of observable behaviour.","The test concerns observable conversation; it does not by itself prove that a machine is conscious or understands like a human."],
["The video mainly describes learning from examples, using pictures of dogs, and explains that a system improves with data.","Supervised learning uses labelled examples, such as pictures marked “dog”. Unsupervised learning looks for structures without supplied labels. Reinforcement learning uses trial, error and rewards; this idea is used in AlphaGo.","A model is trained on data and tested on new examples. Performance on unseen examples helps evaluate generalization."],
["The video shows scripts and films written partly or fully by AI, but says that 2016 results do not make much sense yet.","Sunspring (2016) is a short film whose screenplay was generated by a neural network. Since then, generative AI has made major progress in producing coherent text and images; this goes beyond the video’s assessment.","The video is from 2016. When comparing it with today, clearly say that this is later context."],
["The video presents AlphaGo as possibly the first non-expert system of its year, in contrast with expert systems based on rules.","This claim is too broad if taken literally: machine-learning techniques existed before AlphaGo, including in speech and image recognition. AlphaGo is better described as a major milestone because it reached an exceptional level at Go.","Careful English phrasing: “The video presents AlphaGo as a contrast to rule-based expert systems.” Avoid saying it was the first non-expert system in all history."]

var VIDEO_DATA=[
{
title:"Video 1 — What is Artificial Intelligence Exactly? (ColdFusion, juillet 2016, environ 9 min)",
summary:"The video is called What is Artificial Intelligence Exactly? It comes from the channel ColdFusion. The goal is to explain what AI really is. First, the video goes back to the beginning. In 1955, John McCarthy asked: can a machine copy human intelligence? So AI is a machine that can do tasks that humans usually do with their brain. Then the video explains what intelligence is: learning, thinking, solving problems, seeing, and understanding language. After that, it shows different types of AI: strong AI, weak AI, and something in the middle. The examples are Deep Blue, Watson, and DeepMind. Next, it explains machine learning: the computer learns from many examples, for example pictures of dogs. Finally, it compares expert systems with AlphaGo. AlphaGo learns by itself. The conclusion is simple: there are many types of AI, and each one is good at only one kind of task.",
summaryPlan:"Définition et origine → intelligence → types d’IA (strong / weak / middle) → machine learning → expert systems vs AlphaGo.",
notions:[
["Définition de l’IA et origine du terme","Dans la vidéo : il faut revenir à la définition la plus pure, celle de l’époque où le terme est né. Le terme est attribué à John McCarthy, à la conférence de Dartmouth (1955 selon la vidéo). Avant cela, le domaine n’était pas défini, même si Alan Turing et d’autres avaient déjà travaillé dessus. La proposition dit que chaque aspect de l’apprentissage ou de l’intelligence peut être décrit assez précisément pour qu’une machine le simule. En résumé : une IA est une machine capable de résoudre des problèmes que les humains résolvent avec leur intelligence naturelle, et elle montre une forme d’intelligence quand elle apprend à s’améliorer sur ces problèmes.","Pour mieux comprendre : la proposition a été écrite en 1955 par McCarthy, Minsky, Rochester et Shannon ; l’atelier de Dartmouth College a eu lieu à l’été 1956. C’est ce qui explique que les sources donnent 1955 ou 1956. Cet atelier est considéré comme l’acte de naissance de l’IA comme domaine de recherche. McCarthy définissait plus tard l’IA comme la science et l’ingénierie de la fabrication de machines intelligentes. Les manuels modernes (Russell et Norvig) la définissent comme l’étude d’agents intelligents : des systèmes qui perçoivent leur environnement et agissent pour maximiser leurs chances d’atteindre leurs objectifs. Il n’y a pas de définition unique. Il existe aussi l’AI effect : dès qu’une machine réussit quelque chose d’impressionnant, on a tendance à dire que ce n’est « pas vraiment de l’IA ». Le sens du mot bouge donc avec le temps."],
["Alan Turing","Dans la vidéo : simplement cité comme l’un de ceux qui ont travaillé sur l’IA avant 1955.","Pour mieux comprendre : en 1950, Turing publie « Computing Machinery and Intelligence » et propose le test de Turing (jeu de l’imitation) : si un juge humain, qui discute par écrit, n’arrive pas à distinguer la machine d’un humain, on peut considérer que la machine « pense ». C’est une manière pratique de contourner la question « qu’est-ce que penser ? »."],
["Les 7 axes de la proposition de 1955","Dans la vidéo : (1) simuler les fonctions supérieures du cerveau, (2) programmer un ordinateur à utiliser le langage, (3) organiser des neurones hypothétiques pour former des concepts, (4) mesurer la complexité d’un problème, (5) auto-amélioration, (6) abstraction (traiter des idées plutôt que des événements), (7) aléatoire et créativité. Selon la vidéo, après 60 ans, le langage, la mesure de complexité et l’auto-amélioration sont atteints au moins en partie, et la créativité commence tout juste à être explorée.","Pour mieux comprendre : cerveau et neurones → neurosciences computationnelles et réseaux de neurones artificiels ; langage → traitement du langage naturel (NLP) ; complexité → théorie de la complexité algorithmique ; auto-amélioration → machine learning ; abstraction → apprentissage de représentations (les couches profondes apprennent des concepts de plus en plus abstraits) ; créativité → IA générative (texte, images, musique). Depuis la vidéo, ce domaine a beaucoup progressé, donc c’est un bon point à mentionner pour montrer du recul."],
["Qu’est-ce que l’intelligence ? (Jack Copeland)","Dans la vidéo : selon Jack Copeland, auteur de livres sur l’IA, les facteurs importants sont : la généralisation (apprendre pour mieux gérer des situations jamais rencontrées), le raisonnement (tirer des conclusions adaptées à la situation), la résolution de problèmes (« étant donné ces données, trouve X »), la perception (analyser un environnement scanné, ex. voiture autonome) et la compréhension du langage (suivre la syntaxe et d’autres règles comme un humain).","Pour mieux comprendre : Copeland est un philosophe spécialiste de Turing. Sa liste revient dans les articles d’encyclopédie sur l’IA. L’idée à retenir : l’intelligence n’est pas une seule capacité mais un ensemble. C’est pour cela qu’une IA peut être excellente dans un domaine (échecs) et nulle dans un autre."],
["Exemples de domaines de l’IA","Dans la vidéo : machine learning, computer vision, natural language processing, robotics, pattern recognition, knowledge management.","Pour mieux comprendre : machine learning = apprendre à partir de données ; computer vision = faire « voir » les images à l’ordinateur (reconnaître objets, visages) ; NLP = comprendre et produire du langage humain (traduction, assistants vocaux) ; robotics = machines qui perçoivent et agissent dans le monde physique ; pattern recognition = repérer des régularités dans les données (voix, écriture, images) ; knowledge management = organiser et exploiter des connaissances (bases de connaissances, lié aux systèmes experts)."],
["Strong AI vs weak AI","Dans la vidéo : la strong AI consiste à simuler le cerveau humain en construisant des systèmes qui pensent, ce qui nous éclairerait aussi sur le fonctionnement du cerveau. On en est très loin. La weak AI est un système qui se comporte comme un humain sans nous apprendre comment le cerveau marche. Il existe un terrain intermédiaire : un système inspiré du raisonnement humain mais qui n’a pas à s’y tenir.","Pour mieux comprendre : le sens courant (issu du philosophe John Searle, 1980) : la strong AI serait une machine qui a réellement une compréhension et un esprit, alors que la weak AI simule l’intelligence sans comprendre. La définition de la vidéo insiste sur « éclairer le cerveau », ce qui est un peu différent : à ne pas confondre à l’oral. Vocabulaire plus courant aujourd’hui : narrow AI (IA étroite, une tâche précise, c’est tout ce qui existe aujourd’hui), AGI (artificial general intelligence, niveau humain sur tous les domaines, théorique) et ASI (artificial superintelligence, au-dessus de l’humain, hypothétique)."],
["Deep Blue (exemple de weak AI)","Dans la vidéo : IA d’IBM qui joue aux échecs. Elle traitait des millions de coups avant d’en jouer un seul.","Pour mieux comprendre : Deep Blue a battu le champion du monde Garry Kasparov en 1997. Elle fonctionne par recherche en force brute (environ 200 millions de positions par seconde) avec une fonction d’évaluation écrite à partir de connaissances d’experts en échecs, sur du matériel spécialisé. Elle n’apprend pas : c’est donc plus proche d’un système expert que d’un système qui apprend."],
["IBM Watson (terrain intermédiaire)","Dans la vidéo : Watson lit beaucoup d’informations, repère des motifs et construit des preuves pour dire « je suis à X % sûr que c’est la bonne réponse ». Il est inspiré du raisonnement humain sans s’y limiter.","Pour mieux comprendre : Watson a gagné au jeu télévisé Jeopardy! en 2011 face à deux anciens champions. Il combine de nombreux algorithmes de recherche et d’analyse de texte, génère plusieurs réponses candidates, puis évalue chacune avec des preuves et un score de confiance. Il a ensuite été adapté à d’autres domaines comme la santé, avec des résultats mitigés."],
["Google DeepMind, deep learning et réseaux de neurones","Dans la vidéo : le « deep learning » de Google imite la structure du cerveau avec des réseaux de neurones, mais sans suivre exactement son fonctionnement. Le système utilise des nœuds qui jouent le rôle de neurones artificiels reliés entre eux. Les réseaux de neurones sont un sous-ensemble du machine learning.","Pour mieux comprendre : un réseau de neurones artificiel est organisé en couches de nœuds. Chaque connexion a un poids, et l’apprentissage consiste à ajuster ces poids pour réduire les erreurs (algorithme de rétropropagation). Deep learning = réseaux avec de nombreuses couches. Emboîtement à retenir : IA ⊃ machine learning ⊃ réseaux de neurones / deep learning. DeepMind est une entreprise britannique fondée en 2010 et rachetée par Google en 2014. L’inspiration du cerveau est lointaine : un vrai neurone est bien plus complexe qu’un nœud artificiel."],
["Machine learning","Dans la vidéo : algorithmes qui permettent à un logiciel d’améliorer ses performances au fil du temps quand il obtient plus de données. C’est de la programmation par exemples entrée/sortie plutôt que par code écrit à la main. Exemple : un programmeur ne saurait pas coder « reconnaître un chien », mais il peut donner assez d’images de chiens à un programme pour qu’il reconnaisse un chien jamais vu.","Pour mieux comprendre : définition historique d’Arthur Samuel (1959) : donner aux ordinateurs la capacité d’apprendre sans être explicitement programmés. Trois grandes familles : apprentissage supervisé (données étiquetées, comme l’exemple du chien), non supervisé (trouver des structures sans étiquettes) et par renforcement (apprendre par essais et récompenses, utilisé dans AlphaGo). On entraîne le modèle sur des données puis on le teste sur des données nouvelles : c’est la généralisation, que Copeland cite comme facteur d’intelligence. C’est un lien utile entre notions 4 et 10."],
["Expert system","Dans la vidéo : système qui emploie la connaissance humaine dans un ordinateur pour résoudre des problèmes qui demandent normalement de l’expertise humaine. C’est l’application pratique d’une base de connaissances. Selon la vidéo, la plupart des algorithmes d’IA sont des systèmes experts.","Pour mieux comprendre : composition : une base de connaissances (faits et règles de type SI... ALORS...) et un moteur d’inférence qui enchaîne les règles. Exemples historiques des années 1970-80 : MYCIN (aide au diagnostic d’infections) et DENDRAL (chimie). Limites : il faut que des humains écrivent toutes les règles (goulot d’étranglement de l’acquisition des connaissances), le système est fragile hors de son domaine et il n’apprend pas seul. Ces limites ont contribué aux « hivers de l’IA ». La phrase « la plupart des IA sont des systèmes experts » reflète les sources de la vidéo ; aujourd’hui, c’est le machine learning qui domine."],
["AlphaGo","Dans la vidéo : présenté comme peut-être le premier système prouvé non expert de l’année. Ses algorithmes ne reposent pas sur des règles écrites à la main mais sur des techniques générales de machine learning, avec lesquelles il découvre lui-même comment gagner au Go. Demis Hassabis (cofondateur de DeepMind) espère que ces méthodes pourront aider sur des problèmes de société comme la modélisation du climat ou l’analyse de maladies complexes.","Pour mieux comprendre : le Go est bien plus complexe que les échecs (nombre de positions astronomique), donc la force brute ne suffit pas. AlphaGo combine des réseaux de neurones profonds et une recherche arborescente de type Monte-Carlo. Il a d’abord appris de parties humaines, puis en jouant contre lui-même (apprentissage par renforcement). Il a battu Lee Sedol 4 à 1 en mars 2016, quelques mois avant la vidéo. Suite : AlphaGo Zero (2017) apprend sans données humaines, et AlphaFold (prédiction de structures de protéines) est une vraie application scientifique du même esprit, qui répond à l’espoir de Hassabis sur la santé."],
["Créativité et IA","Dans la vidéo : des scripts de séries web, de courts films et même un long métrage ont été écrits en tout ou partie par une IA, mais ça n’a pas vraiment de sens (extraits montrés pour le divertissement).","Pour mieux comprendre : l’exemple le plus connu de l’époque est le court métrage Sunspring (2016), dont le scénario a été écrit par un réseau de neurones. Depuis, l’IA générative (modèles de langage, d’images, etc.) produit des textes cohérents, ce qui change beaucoup le constat de la vidéo."],
["Limites et points critiques de la vidéo 1","La vidéo date de 2016 : elle ne parle ni du deep learning moderne à grande échelle, ni des modèles génératifs actuels. La transcription automatique écrit « Jay McCartney » et « Darkmouth » : il s’agit de John McCarthy et du Dartmouth Conference. L’affirmation « AlphaGo est le premier système non expert » est discutable : des systèmes de machine learning existaient bien avant (reconnaissance vocale, reconnaissance d’images), même si AlphaGo est un jalon marquant. La définition de strong AI de la vidéo diffère du sens courant (esprit réel / AGI). Date de Dartmouth : proposition en 1955, atelier en 1956.","À l’oral, précise toujours quand une information vient de la vidéo de 2016 et quand tu ajoutes un recul actuel. Ne présente pas comme un fait universel l’affirmation qu’AlphaGo serait le premier système non expert."]

linksTitle:"Partie 3 — Liens entre les vidéos",
linksOral:"The link between the two videos is the difference between reality and science fiction. Video 1 is about the present. It explains the technical side, like machine learning and narrow AI, and it shows that AI is a tool, like Deep Blue or AlphaGo. Video 2 is about the future. It talks about strong AI, brain uploading and the singularity. Both videos talk about weak AI and strong AI, and both say that today we only have weak AI. Both videos also talk about IBM Watson. In Video 1, Watson is in the middle: it reads a lot, finds patterns and gives a confidence level. In Video 2, Watson learned bad words from the internet. This shows that AI only learns from data, and it has no moral sense. Finally, Alan Turing is in both videos: he is a pioneer in Video 1, and his test is in Video 2.",

title:"Video 2 — What Is The Singularity? (BBC Earth Lab, Greg Foot, janvier 2016, 6 min 45)",
summary:"This video is called What Is The Singularity? It comes from BBC Earth Lab, and the presenter is Greg Foot. It starts with a question: what would happen if computers became much smarter than us? The singularity is the moment when technology goes so fast that human life changes completely. The mathematician John von Neumann talked about this idea before he died in 1957, and today Ray Kurzweil is its champion: he says that computing power grows exponentially. For many people, the singularity means that we will upload our minds into computers and live forever. For that, we need two things: computers as smart as us, and a way to upload our brains. The video talks about the Turing test and about weak AI and strong AI. Today we only have weak AI, and even IBM's Watson had to wipe part of its memory because it learned bad words. Simulating a brain is very hard: in 2013, a supercomputer needed 40 minutes to simulate one second of about 2% of a brain. Should we be afraid? It depends. A bad AI would not need a body: the Stuxnet virus destroyed machines in Iran. Asimov's Three Laws of Robotics try to protect us, but experts prefer to cooperate with robots. At the end, the presenter hopes that we will be ready.",
summaryPlan:"Définition (von Neumann, Kurzweil) → upload du cerveau et deux conditions → test de Turing et IA faible/forte → Watson et simulation du cerveau → danger (Stuxnet) → lois d’Asimov et conclusion.",
notions:[
["La singularité (The Singularity)","Dans la vidéo : la vidéo commence par l’histoire classique de science-fiction : on construit un ordinateur super intelligent, il se retourne contre nous. Que se passerait-il si les humains devenaient les esclaves, et non plus les bergers ? Ce moment s’appelle une singularité. Le terme est probablement dû au mathématicien John von Neumann, qui avant sa mort en 1957 parlait d’un progrès technologique de plus en plus rapide, comme s’il approchait d’une « singularité essentielle » après laquelle les affaires humaines ne pourraient plus continuer comme avant. Le champion actuel est l’informaticien Ray Kurzweil : selon sa loi des rendements accélérés, la puissance de calcul croît de façon exponentielle, jusqu’à des ordinateurs qui égalent puis dépassent l’intelligence humaine. L’auteur Richard Dooling l’appelle « the Rapture of the Geeks ». Selon le New Scientist, la plupart des partisans croient qu’on téléchargera notre conscience dans un ordinateur pour vivre éternellement : « la mort de la mort ». Le petit plus de la fiche CC1 : c’est le concept central du transhumanisme. Kurzweil (Google) la prédit pour 2045 (ce n’est pas dit dans la vidéo).","Pour mieux comprendre : le terme a été popularisé par l’écrivain Vernor Vinge dans un essai de 1993. Kurzweil l’a rendu célèbre avec son livre The Singularity Is Near (2005). Croissance exponentielle : une quantité qui double à intervalle régulier (1, 2, 4, 8, 16...). Elle semble lente au début, puis explose. Kurzweil explique que le mot est une métaphore venue de la physique : l’horizon des événements. On ne peut pas voir ce qu’il y a derrière. « Rapture » désigne l’enlèvement des fidèles dans certaines croyances chrétiennes. L’expression se moque donc de la singularité en la comparant à une croyance religieuse. Les critiques disent que la puissance des puces ne doublera pas pour toujours et que personne ne peut prédire une date précise."],
["Le test de Turing","Dans la vidéo : parmi les tests conçus pour repérer une intelligence artificielle, le plus célèbre est le test de Turing, proposé par le mathématicien Alan Turing en 1950. Dans sa forme moderne, c’est un concours : un ordinateur doit tromper des juges humains en leur faisant croire qu’il est l’un des leurs. En 2014, une machine l’a réussi : le programme Eugene Goostman a convaincu 33 % des juges qu’il était un garçon ukrainien de 13 ans. Mais la vidéo rappelle qu’Eugene est une IA faible.","Pour mieux comprendre : un personnage de garçon de 13 ans qui parle anglais comme langue étrangère excuse beaucoup d’erreurs : c’est une astuce. Beaucoup d’experts ont donc contesté cette réussite. Le test mesure l’imitation, pas la compréhension, et ne teste que le langage. Lien avec la vidéo 1 : Turing y est cité comme pionnier (notion 2 de la vidéo 1)."],
["IA faible et IA forte (weak AI / strong AI)","Dans la vidéo : l’IA faible est un ordinateur qui se contente de simuler l’intelligence humaine : il a l’air intelligent, mais ne l’est pas vraiment. L’IA forte est plus proche de ce que Turing imaginait : créer quelque chose qui est vraiment intelligent. Elle dit que tout programme assez avancé pourrait agir comme un esprit : il n’y aurait aucune différence entre ce qu’on vit quand on pense et ce que fait l’algorithme avancé. Pour télécharger nos cerveaux et vivre dans l’ordinateur, il faudrait de l’IA forte.","Pour mieux comprendre : cette définition est proche de celle du philosophe John Searle (1980) : l’IA forte aurait un vrai esprit. Son argument de la « chambre chinoise » dit qu’un programme peut manipuler des symboles sans rien comprendre. Attention : la vidéo 1 définit l’IA forte autrement (simuler le cerveau pour mieux le comprendre). Pour l’oral, retiens la nuance entre les deux. Vocabulaire actuel : narrow AI (tout ce qui existe), AGI (niveau humain dans tous les domaines, théorique)."],
["Où en est-on aujourd’hui ? Watson et la vision","Dans la vidéo : nos efforts ne semblent pas à la hauteur. Des ordinateurs font des choses étonnantes (conduire des voitures, jouer aux échecs, recommander des films sur Netflix), mais en suivant des algorithmes relativement simples. Quand ils paraissent humains, c’est souvent parce qu’ils sont plus bêtes que prévu. Exemple amusant : l’équipe qui a construit le supercalculateur Watson d’IBM a dû effacer une partie de sa mémoire, parce qu’il avait pris l’habitude de jurer en apprenant sur le site urbandictionary.com. Les efforts pour une IA consciente sont encore plus faibles, peut-être parce qu’on ne comprend pas vraiment la conscience humaine. Mais on progresse sur des éléments précis : on apprend aux ordinateurs à voir, et la moitié de la puissance du cerveau humain sert au traitement visuel.","Pour mieux comprendre : l’histoire de Watson date de 2013. Elle montre qu’une IA apprend de ses données sans filtre moral : si les données sont mauvaises, le résultat l’est aussi. C’est exactement le principe du machine learning de la vidéo 1 (apprendre à partir d’exemples). Watson est aussi un lien direct entre les deux vidéos. Les exemples « jouer aux échecs » et « conduire une voiture » sont des IA étroites, comme Deep Blue dans la vidéo 1."],
["Simuler le cerveau et brain uploading","Dans la vidéo : on lance des simulations neuronales. On commence petit, avec un cerveau virtuel de ver nématode, qui n’a que 302 neurones. Pour l’humain : en 2013, des chercheurs du Japon et d’Allemagne ont utilisé un supercalculateur pour modéliser 1 seconde d’activité de 1,73 milliard de neurones, soit environ 2 % du nombre d’un cerveau humain complet. Cela a pris 40 minutes sur 82 944 processeurs. Le Human Brain Project veut simuler tout le cerveau humain, mais il coûte un milliard de livres et est à peine lancé. À l’université d’État de l’Ohio, des chercheurs ont annoncé à l’été 2015 avoir fait pousser en laboratoire un cerveau humain presque entièrement formé, une première. Idée : réussir à créer un esprit intelligent en copiant un système biologique existant. Le petit plus de la fiche CC1 : le supercalculateur était le « K computer » (Japon). L’architecture parallèle du cerveau humain reste bien supérieure à nos machines actuelles.","Pour mieux comprendre : le cerveau humain compte environ 86 milliards de neurones (1,73 milliard est bien environ 2 % de ce total). Le ver nématode de la simulation est probablement C. elegans, l’animal dont le système nerveux est le mieux connu. Le brain uploading (téléchargement de l’esprit) reste de la science-fiction : on ne sait même pas si un esprit peut être copié."],
["Faut-il avoir peur ? Stuxnet","Dans la vidéo : que se passe-t-il après la singularité, faut-il avoir peur ? « Ça dépend. » Une IA malveillante n’aurait probablement pas de corps, mais le monde est aujourd’hui si automatisé et connecté qu’elle pourrait causer de vrais dangers dans le monde physique. Exemple : le virus Stuxnet, toujours officiellement mystérieux, qui a détruit des centrifugeuses de l’usine d’enrichissement d’uranium de Natanz en Iran. Le petit plus de la fiche CC1 : Stuxnet est la première cyber-arme connue à avoir détruit du matériel industriel.","Pour mieux comprendre : Stuxnet a été découvert en 2010. La presse l’attribue généralement aux États-Unis et à Israël, sans confirmation officielle complète (à vérifier). Idée à retenir : notre monde est connecté, donc un programme peut agir sur le monde physique sans robot."],
["Les trois lois de la robotique d’Asimov","Dans la vidéo : peut-être qu’on s’en sortirait si on donnait des règles à l’IA. L’auteur Isaac Asimov y a pensé avec ses trois lois : 1) un robot ne peut pas blesser un être humain ni, par son inaction, le laisser être blessé ; 2) un robot doit obéir aux ordres des humains, sauf s’ils contredisent la première loi ; 3) un robot doit protéger sa propre existence, tant que cela ne contredit pas les deux premières. Asimov a ensuite ajouté une loi zéro : l’IA doit aussi protéger l’humanité dans son ensemble. Le site de science-fiction io9 a interrogé des spécialistes de l’éthique des machines : ils n’étaient pas enthousiastes et préfèrent coopérer avec les intelligences robotiques pour s’entendre équitablement avec elles. Le petit plus de la fiche CC1 : ce sont des règles de science-fiction presque impossibles à coder en réalité. Comment définir mathématiquement « blesser » ou « l’humanité » ?","Pour mieux comprendre : les histoires d’Asimov montrent justement les failles de ces lois. Elles sont devenues une référence culturelle, pas une solution technique."],
["La conclusion de la vidéo","Dans la vidéo : la présentation finit sur une note personnelle : l’auteur espère qu’on sera prêt quand la singularité arrivera et, au cas où ce serait bientôt, il va traiter beaucoup mieux son ordinateur et son téléphone. Il pose aussi une question : sait-on vraiment où sont toutes nos données, et disparaîtraient-elles vraiment si on essayait de les supprimer ?","Pièges à éviter à l’oral : la vidéo ne répond pas simplement « oui » à la question de la peur : elle dit « ça dépend ». Chiffres du cerveau : 1 seconde d’activité, 1,73 milliard de neurones (environ 2 % d’un cerveau humain), 40 minutes, 82 944 processeurs, chercheurs du Japon et d’Allemagne, en 2013. Kurzweil : la vidéo parle de la loi des rendements accélérés. Elle ne cite ni la loi de Moore ni la date de 2045. La conclusion est un espoir d’être prêt, pas un ordre. Les lois d’Asimov : il y en a trois, plus une loi zéro. Les éthiciens préfèrent la coopération. Le test de Turing est bien dans la vidéo 2 (Eugene Goostman, 33 %), pas seulement dans la vidéo 1."]
],
linksTitle:"Partie 3 — Liens entre les vidéos",

{id:"1a",v:0,topic:"Definition",level:"basic",q:"What is artificial intelligence (AI)?",a:"AI is the development of machines that can perform tasks usually associated with human intelligence, such as learning, reasoning and problem-solving.",hint:"Mention tasks usually done by human intelligence."},
{id:"1b",v:0,topic:"History",level:"basic",q:"Who coined the term AI, and when was the Dartmouth proposal written?",a:"John McCarthy and colleagues proposed the term. The proposal was written in 1955, and the Dartmouth workshop took place in 1956.",hint:"The proposal and workshop were in different years."},
{id:"1c",v:0,topic:"Types of AI",level:"basic",q:"What is the difference between strong AI and weak AI?",a:"Strong AI aims at human-like general intelligence. Weak AI, also called narrow AI, is designed for specific tasks. “Weak” does not mean that it performs badly.",hint:"General intelligence versus a specific task."},
{id:"1d",v:0,topic:"Examples",level:"basic",q:"Why is Deep Blue an example of weak AI?",a:"Deep Blue was designed to play chess. Its excellent performance at chess did not mean that it had general human-like intelligence.",hint:"What could it do, and what does that not prove?"},
{id:"1e",v:0,topic:"Machine learning",level:"intermediate",q:"What is machine learning? Give a simple example.",a:"Machine learning is an approach in which a computer learns patterns from data instead of relying only on rules written by people. For example, it can learn to recognize dogs from pictures.",hint:"Use the words data and examples."},
{id:"1f",v:0,topic:"Neural networks",level:"intermediate",q:"How are AI, machine learning and neural networks related?",a:"AI is the broad field. Machine learning is one approach within AI, and neural networks are one family of models used in machine learning. They are inspired by the brain, but do not reproduce it exactly.",hint:"From broadest concept to most specific."},
{id:"1g",v:0,topic:"Expert systems",level:"basic",q:"What is an expert system, and what is one limitation?",a:"An expert system uses a knowledge base and human-written rules to solve problems in a specific domain. People must write and maintain the rules, and unusual cases may be difficult to anticipate.",hint:"Mention a knowledge base and rules."},
{id:"1h",v:0,topic:"AlphaGo",level:"intermediate",q:"How was AlphaGo different from a traditional expert system?",a:"A traditional expert system relies on human-written rules. AlphaGo used machine-learning methods to learn strategies for Go, rather than relying only on hand-written rules.",hint:"Rules written by people versus learning through training."},
{id:"2a",v:1,topic:"Singularity",level:"basic",q:"What does “the technological singularity” mean in the second video?",a:"It is a hypothetical future point at which technological progress, often linked to AI that can improve itself, becomes so rapid that it is difficult to predict what happens next. It is a scenario, not an established fact.",hint:"A possible future scenario, not something proven."},
{id:"2b",v:1,topic:"Brain simulation",level:"intermediate",q:"What is meant by simulating the brain or “brain uploading”?",a:"Brain simulation means trying to model some processes of the brain. Brain uploading is a hypothetical idea of transferring or recreating a person’s mind in a computer. This is speculative, not an existing capability.",hint:"Explain both terms and mention uncertainty."},
{id:"2c",v:1,topic:"Risk",level:"basic",q:"Does the video suggest that we should be afraid of AI? Explain the nuance.",a:"The question is presented as open rather than having a simple yes-or-no answer. AI may bring benefits, but possible risks depend on how systems are designed and used. We should distinguish realistic risks from speculation.",hint:"Avoid answering only yes or no."},
{id:"2d",v:1,topic:"Stuxnet",level:"intermediate",q:"Why is Stuxnet relevant to a discussion about technology and risk?",a:"Stuxnet is presented as malicious software that can affect real-world industrial systems. It illustrates that software can have consequences beyond a computer screen, but it is not proof that an AI singularity will happen.",hint:"Connect software, physical systems and the limits of the example."},
{id:"2e",v:1,topic:"Asimov",level:"basic",q:"What are Asimov’s Three Laws of Robotics meant to do?",a:"They are fictional rules created by Isaac Asimov to explore how robots might behave and how conflicts between rules could arise. They are a literary thought experiment, not real laws that automatically govern robots.",hint:"They come from science fiction."},
{id:"2f",v:1,topic:"Turing test",level:"challenge",q:"Does passing the Turing test prove that a machine is conscious? Why or why not?",a:"No. The test evaluates whether a judge can distinguish the machine from a human through conversation. Passing it would not, on its own, prove consciousness or human-like understanding.",hint:"What does the test observe, and what does it not prove?"}

var direction=vocabDirection=="mix"?(K["mixdir"]||"enfr") : vocabDirection;
if(!flip){h+='<div class="term">'+(direction=="enfr"?x[0]:x[1])+'</div><div style="display:flex;gap:10px;align-items:center">'+spk(direction=="enfr"?x[0]:x[1])+'<span class="small">Touche la carte pour voir la réponse</span></div>'}
else{h+='<div class="fr">'+(direction=="enfr"?x[1]:x[0])+'</div><div>'+x[2]+'</div><div class="ex">“'+x[3]+'”</div>'+spk(x[3])}
h+='</div><p class="small" style="text-align:center">'+(i+1)+' / '+L.length+'</p><div class="row"><button onclick="mv(-1)" aria-label="Précédent">‹</button><button class="no" onclick="mark(false)">À revoir</button><button class="ok" onclick="mark(true)">Je sais</button><button onclick="mv(1)" aria-label="Suivant">›</button></div>'}
else if(s=="talk"){h+=talkUI()}
else{
if(!qz||list().indexOf(qz.x)<0)newQ();
h+='<p class="small">'+tr("Score : ","Score: ")+sc[0]+' / '+sc[1]+'. '+tr("Quelle est la traduction ?","What is the translation?")+'</p><div class="card" style="min-height:130px;cursor:default"><div class="term">'+qz.x[0]+'</div>'+spk(qz.x[0])+'</div>';
qz.o.forEach(function(o,n){var c="opt";if(qz.p!==null){if(o==qz.x[1])c+=" good";else if(n==qz.p)c+=" bad"}
h+='<button class="'+c+'" onclick="pick('+n+')">'+o+'</button>'});
if(qz.p!==null)h+='<p class="en">'+qz.x[2]+'. “'+qz.x[3]+'”</p><div class="row"><button class="pri" onclick="nextQ()">Question suivante</button></div>'}
}else if(mode==="video"){
h+=videoDisplay();
}else{h+=questionsDisplay();}
document.getElementById("app").innerHTML=h;cnt();if(mode==="video"&&videoLang==="en")translateRenderedContent()}
render();
