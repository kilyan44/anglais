["Le début : Dartmouth (1955-1956)","AI is a machine that does tasks that humans usually do with their brain. The term comes from John McCarthy.",["Le terme « IA » vient de John McCarthy (proposition de Dartmouth en 1955, atelier en 1956).","Avant, le domaine n’avait pas de nom (Alan Turing avait déjà travaillé dessus).","IA : une machine qui fait des tâches humaines et apprend à s’améliorer."]],
["Les 7 axes de départ","The first AI plan had seven areas: brain, language, neurons, complexity, self-improvement, abstraction and creativity.",["Cerveau, langage, neurones, complexité, auto-amélioration, abstraction, hasard et créativité.","En 2016 : langage, complexité et auto-amélioration en partie réalisés.","La créativité commence : des scénarios écrits par une IA, mais sans grand sens."]],
["Qu’est-ce que l’intelligence ?","Intelligence has five parts: learning, reasoning, problem solving, perception and language.",["Selon Jack Copeland : généralisation, raisonnement, résolution de problèmes, perception, langage.","L’intelligence a plusieurs facettes. Une IA est forte sur une seule."]],

["What are the main parts of intelligence?","Cinq : apprendre, raisonner, résoudre des problèmes, percevoir, comprendre le langage (Copeland).","There are five: learning, reasoning, problem solving, perception and understanding language."],

rc.onresult=function(e){var interim="";for(var k=e.resultIndex;k<e.results.length;k++){var result=e.results[k],part=(result[0].transcript||"").trim();if(!part)continue;if(result.isFinal){finalParts[k]=part;if(k===e.resultIndex)lastInterim=""}else interim=part}
var finals=finalParts.filter(Boolean).join(" ").trim();lastInterim=interim;on((finals+(interim?" "+interim:"")).trim())};
rc.onerror=function(e){if(e.error=="not-allowed"||e.error=="service-not-allowed")merr="Micro non autorisé. Vérifie les permissions du navigateur, puis réessaie.";else if(e.error=="audio-capture")merr="Aucun micro détecté. Vérifie ton micro ou utilise la saisie au clavier.";else if(e.error=="no-speech")merr="Aucune parole détectée. Parle un peu plus fort et réessaie.";else if(e.error=="network")merr="La reconnaissance vocale a un problème de réseau. Réessaie ou écris ta réponse.";else if(e.error!="aborted")merr="Problème de reconnaissance vocale ("+e.error+"). Réessaie."};
rc.onend=function(){if(sessionEnded)return;sessionEnded=true;var text=finalParts.filter(Boolean).join(" ").trim();if(text)on(text);done()};
try{rc.start()}catch(e){return "Micro occupé, réessaie."}return ""}
function newT(){var L=list(),x=L[Math.floor(Math.random()*L.length)];tk={x:x,heard:"",res:null,h:0,msg:"",live:false,show:false}}
function hintV(x,l){var t=x[0].split(/\s*[\/(]\s*/)[0].replace(/…/g,"").trim(),w=t.split(/\s+/);
return l==1?"Commence par « "+t.charAt(0)+" », "+w.length+" mot"+(w.length>1?"s":""):l==2?"Début : « "+w[0]+" … »":"Réponse : "+x[0]}
function talkUI(){if(!tk||list().indexOf(tk.x)<0)newT();var x=tk.x;
var h='<p class="small">Dis en anglais le mot ou la phrase qui correspond.</p><div class="card" style="min-height:120px;cursor:default"><span class="tag">'+(x[4]=="v"?"Vocabulaire":"À l’oral")+'</span><div class="fr">'+x[1]+'</div><div>'+x[2]+'</div></div>';
h+='<div class="row"><button class="pri" onclick="tkRec()">'+(tk.live?"🎙 J’écoute…":"🎤 Parler")+'</button><button onclick="tkHint()">💡 Indice</button><button onclick="tkShow()">👁 Voir le mot</button></div>';
if(tk.h)h+='<p class="en">💡 '+esc(hintV(x,tk.h))+'</p>';
h+='<input id="tkin" class="in" placeholder="Ou écris ici" value="'+esc(tk.heard)+'" oninput="tk.heard=this.value" onkeydown="if(event.keyCode==13)tkChk()"><div class="row"><button onclick="tkChk()">Valider</button><button onclick="newT();render()">Suivant</button></div>';
if(tk.show)h+='<div class="res good"><b>'+esc(x[0])+'</b><br>'+esc(x[1])+'<br>'+esc(x[2])+'<br><i>“'+esc(x[3])+'”</i></div>'+spk(esc(x[0]));
if(tk.msg)h+='<p class="small">'+esc(tk.msg)+'</p>';
if(tk.res===true)h+='<p class="res good">✅ Bien dit ! <b>'+esc(x[0])+'</b></p>'+spk(esc(x[0]));
if(tk.res===false)h+='<p class="res bad">❌ J’ai compris : « '+esc(tk.heard)+' ». Réponse attendue : <b>'+esc(x[0])+'</b></p>'+spk(esc(x[0]));
return h}
var rs=false;
function rst(){if(!rs){rs=true;render();setTimeout(function(){if(rs){rs=false;render()}},5000);return}
Object.keys(K).forEach(function(k){if(k.charAt(0)=="v")delete K[k]});save();rs=false;i=0;flip=false;qz=null;sc=[0,0];render()}
function tkShow(){tk.show=!tk.show;render()}
function tkHint(){tk.h=Math.min(3,tk.h+1);render()}
function tkChk(){var e=document.getElementById("tkin");if(e)tk.heard=e.value;tk.msg="";
if(!tk.heard.trim()){tk.msg="Dis ou écris quelque chose d’abord.";render();return}
tk.res=okSay(tk.heard,tk.x[0]);if(tk.res){K["v"+tk.x[0]]=true;save()}render()}
function tkRec(){tk.res=null;tk.msg="";tk.heard="";
var m=mic(function(t){tk.heard=t;var e=document.getElementById("tkin");if(e)e.value=t},function(){tk.live=false;if(merr){tk.msg=merr;render()}else tkChk()},false);
if(m)tk.msg=m;else tk.live=true;render()}
function talkQ(n){return '<div class="rec"><div class="row" style="margin:0 0 8px"><button class="pri" id="mb'+n+'" onclick="qRec('+n+')">🎤 Dire ma réponse</button><button onclick="qHint('+n+')">💡 Indice</button></div><div id="qh'+n+'"></div><textarea id="qx'+n+'" rows="3" class="in" placeholder="Ta réponse en anglais : parle ou écris"></textarea><div class="row"><button onclick="qChk('+n+')">Analyser ma réponse</button></div><div id="qo'+n+'"></div></div>'}
function qmsg(n,m){document.getElementById("qo"+n).innerHTML=m?'<p class="small">'+esc(m)+'</p>':""}
function qHint(n){var l=Math.min(3,(qhl[n]||0)+1);qhl[n]=l;var w=Q[n][2].split(" ").slice(0,4).join(" ");
var s=l==1?"Idée : "+QH[n]:l==2?"Commence par : “"+w+" …”":"Modèle : "+Q[n][2];
document.getElementById("qh"+n).innerHTML='<p class="en">💡 '+esc(s)+'</p>'}
function qRec(n){var t=document.getElementById("qx"+n),b=document.getElementById("mb"+n),base=t.value.trim();
if(rcn==n&&rc){try{rc.stop()}catch(e){}return}
var m=mic(function(s){t.value=(base?base+" ":"")+s},function(){rcn=-1;b.textContent="🎤 Dire ma réponse";if(merr)qmsg(n,merr);else if(t.value.trim())qmsg(n,"Transcription terminée. Relis ce qui est écrit et corrige les erreurs avant de cliquer sur « Analyser ma réponse ».")},true);
if(m){qmsg(n,m);return}rcn=n;b.textContent="⏹ Arrêter";qmsg(n,"Parle naturellement, puis appuie sur « Arrêter ». Vérifie la transcription avant l’analyse.")}
function fb(r){var l=function(a){return a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")};
return '<div class="score">'+esc(r.score)+' / 10</div>'+(r.good&&r.good.length?'<p class="lab">✅ Bien</p><ul>'+l(r.good)+'</ul>':'')+(r.problems&&r.problems.length?'<p class="lab">⚠️ À corriger</p><ul>'+l(r.problems)+'</ul>':'<p>Aucun problème trouvé.</p>')+(r.better?'<p class="lab">Version corrigée</p><p class="en">'+esc(r.better)+'</p>'+spk(esc(r.better)):'')}
function loc(t,m){var st=["this","that","with","they","them","their","which","from","does","have","into","also"];
var w=toks(m).filter(function(x){return x.length>3&&st.indexOf(x)<0}),h=toks(t);
w=w.filter(function(x,k){return w.indexOf(x)==k});
var miss=w.filter(function(x){return !h.some(function(y){return same(y,x)})});
var p=Math.round(10*(1-miss.length/Math.max(w.length,1)));
return '<div class="score">'+p+' / 10</div><p class="small">Analyse simple (mots-clés du modèle).</p>'+(miss.length?'<p class="lab">⚠️ Mots-clés absents</p><p>'+esc(miss.join(", "))+'</p>':'<p>✅ Tous les mots-clés sont là.</p>')}
async function qChk(n){var t=document.getElementById("qx"+n).value.trim(),o=document.getElementById("qo"+n);
if(!t){o.innerHTML='<p class="small">Dis ou écris ta réponse d’abord.</p>';return}
o.innerHTML='<p class="small">Analyse en cours…</p>';var r=null;
var p="You are a kind English teacher for a French student (level A2-B1) who prepares a 5-minute oral exam about the video What is Artificial Intelligence Exactly?\nQuestion: "+Q[n][0]+"\nModel answer: "+Q[n][2]+"\nStudent answer (speech-to-text): "+t+"\nBe strict and fair: judge only what the student actually said and whether it answers the question. Do NOT assume missing ideas or give credit for unrelated words. If the answer is unrelated, incoherent, or likely badly transcribed, give a low score and say in French that the transcription may be wrong; do not invent what the student meant. A short but relevant answer can get partial credit, but never a high score if essential ideas are missing.\nReply ONLY with JSON: {\"score\": integer 0-10 (ideas and language), \"good\": [max 3 short strings in French], \"problems\": [max 4 short strings in French: missing ideas, wrong facts, grammar or vocabulary mistakes, each with the correction], \"better\": \"the student answer corrected, in simple English A2-B1\"}";
try{var s=await claude.use("sample");if(s)r=await s.json(p)}catch(e){}
o.innerHTML=(r&&typeof r.score=="number")?fb(r):loc(t,Q[n][2])}
function chips(){var a=[["all","Tous"],["v","Vidéo"],["o","À l’oral"],["rev","À revoir"]];
return '<div class="chips">'+a.map(function(c){return '<button class="'+(f==c[0]?"on":"")+'" onclick="setF(\''+c[0]+'\')">'+c[1]+'</button>'}).join("")+'</div>'}
function spk(t){return '<button class="sp" aria-label="Écouter" onclick="event.stopPropagation();say(this.dataset.s)" data-s="'+t+'">🔊</button>'}
function render(){
document.getElementById("t-vocab").className=mode=="vocab"?"on":"";
document.getElementById("t-video").className=mode=="video"?"on":"";
var h="",s=sub[mode];
if(mode=="vocab"){
var known=V.filter(function(x){return K["v"+x[0]]}).length;
h+='<div class="sub"><button class="'+(s=="cards"?"on":"")+'" onclick="setSub(\'cards\')">Cartes</button><button class="'+(s=="quiz"?"on":"")+'" onclick="setSub(\'quiz\')">Quiz</button><button class="'+(s=="talk"?"on":"")+'" onclick="setSub(\'talk\')">Parler</button></div>'+chips();
h+='<div class="bar"><i style="width:'+Math.round(known*100/V.length)+'%"></i></div><p class="small" style="margin:-6px 0 10px">'+known+' / '+V.length+' mots sus</p>'+(known?'<button class="rs" onclick="rst()">'+(rs?"Sûr ? Appuie encore pour tout remettre à 0":"↺ Remettre les mots à 0")+'</button>':'');
var L=list();
if(!L.length){h+='<p>Aucun mot dans cette liste. Choisis un autre filtre.</p>'}
else if(s=="cards"){
i=Math.min(i,L.length-1);var x=L[i];
h+='<div class="card" role="button" tabindex="0" onclick="fl()" onkeydown="if(event.key==\'Enter\'||event.key==\' \'){event.preventDefault();fl()}"><span class="tag">'+(x[4]=="v"?"Vocabulaire de la vidéo":"Phrase utile à l’oral")+'</span>';
if(!flip){h+='<div class="term">'+x[0]+'</div><div style="display:flex;gap:10px;align-items:center">'+spk(x[0])+'<span class="small">Touche la carte pour voir la réponse</span></div>'}
else{h+='<div class="fr">'+x[1]+'</div><div>'+x[2]+'</div><div class="ex">“'+x[3]+'”</div>'+spk(x[3])}
h+='</div><p class="small" style="text-align:center">'+(i+1)+' / '+L.length+'</p><div class="row"><button onclick="mv(-1)" aria-label="Précédent">‹</button><button class="no" onclick="mark(false)">À revoir</button><button class="ok" onclick="mark(true)">Je sais</button><button onclick="mv(1)" aria-label="Suivant">›</button></div>'}
else if(s=="talk"){h+=talkUI()}
else{
if(!qz||list().indexOf(qz.x)<0)newQ();
h+='<p class="small">Score : '+sc[0]+' / '+sc[1]+'. Quelle est la traduction ?</p><div class="card" style="min-height:130px;cursor:default"><div class="term">'+qz.x[0]+'</div>'+spk(qz.x[0])+'</div>';
qz.o.forEach(function(o,n){var c="opt";if(qz.p!==null){if(o==qz.x[1])c+=" good";else if(n==qz.p)c+=" bad"}
h+='<button class="'+c+'" onclick="pick('+n+')">'+o+'</button>'});
if(qz.p!==null)h+='<p class="en">'+qz.x[2]+'. “'+qz.x[3]+'”</p><div class="row"><button class="pri" onclick="nextQ()">Question suivante</button></div>'}
}else{
h+='<div class="sub"><button class="'+(s=="sum"?"on":"")+'" onclick="setSub(\'sum\')">Résumé par étapes</button><button class="'+(s=="qa"?"on":"")+'" onclick="setSub(\'qa\')">Questions d’oral</button></div>';
if(s=="sum"){
h+='<p class="small">Ouvre chaque étape. La phrase en anglais est le modèle à dire à l’oral.</p>';
C.forEach(function(c,n){h+='<details'+(n==0?" open":"")+'><summary>'+(n+1)+'. '+c[0]+'</summary><p class="en">'+c[1]+'</p><p>'+spk(c[1])+'</p><ul>'+c[2].map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul></details>'})}
else{
h+='<p class="small" id="qc"></p><p class="small">Dis ta réponse à voix haute (🎤) ou écris-la, puis clique sur Analyser. Le bouton 💡 donne des indices.</p>';
Q.forEach(function(q,n){h+='<details class="'+(K["q"+n]?"done":"")+'"><summary>'+(n+1)+'. '+q[0]+'</summary>'+talkQ(n)+'<details class="mod"><summary>Voir le modèle</summary><p><span class="lab">FR</span> '+q[1]+'</p><p class="en">'+q[2]+'</p></details><div class="row" style="margin:0 0 12px">'+spk(q[2])+'<button onclick="tg('+n+',this)">'+(K["q"+n]?"✓ Je sais":"Je sais")+'</button></div></details>'})}
}
document.getElementById("app").innerHTML=h;cnt()}
render();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function (e) { console.warn("Service worker indisponible", e); }); }); }
</script>
